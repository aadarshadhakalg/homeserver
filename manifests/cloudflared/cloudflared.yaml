---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare
---
# RKE2 ships ingress-nginx as a hostPort DaemonSet with no ClusterIP Service of
# its own, so there is nothing stable for the tunnel to dial. This Service
# selects the controller pods and load-balances across every node running one.
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-internal
  namespace: kube-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rke2-ingress-nginx
    app.kubernetes.io/instance: rke2-ingress-nginx
    app.kubernetes.io/component: controller
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare
spec:
  replicas: 2 # each replica holds 4 edge connections; 2 survives a node reboot
  selector:
    matchLabels:
      app: cloudflared
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # Keep the two replicas off the same node, but do not block scheduling.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.3
          args:
            - tunnel
            - --no-autoupdate # pin upgrades to this manifest, not upstream
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
