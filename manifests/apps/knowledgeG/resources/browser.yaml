---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falkordb-browser
  namespace: falkordb
spec:
  # Session keys and stored connections are generated inside the pod, so a
  # second pod would reject the first one's logins. A restart means logging in
  # again, which saves keeping another Secret and volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: falkordb-browser
  template:
    metadata:
      labels:
        app: falkordb-browser
    spec:
      # It never calls the Kubernetes API, and it faces the internet.
      automountServiceAccountToken: false
      containers:
        - name: falkordb-browser
          image: falkordb/falkordb-browser:v2.8.0
          env:
            # TLS ends at Cloudflare, so the pod sees plain HTTP. Without this
            # it would issue non-secure cookies and reject the HTTPS origin.
            - name: AUTH_URL
              value: https://falkor.aadarshadhakal.com.np
            # Prefills the login form. The password is deliberately absent and
            # auto-connect off: otherwise every visitor would be signed in.
            - name: FALKORDB_HOST
              value: falkordb
            # Must stay explicit, for the same reason as in mcp-server.yaml.
            - name: FALKORDB_PORT
              value: "6379"
            - name: FALKORDB_AUTO_CONNECT
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Numeric, because runAsNonRoot can't verify the image's "nextjs".
            runAsUser: 1001
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: falkordb-browser
  namespace: falkordb
spec:
  selector:
    app: falkordb-browser
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# The login form connects to whatever host the visitor types. Without the
# egress rules anyone could probe the cluster and LAN through it, or log in
# against a database of their own.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: falkordb-browser
  namespace: falkordb
spec:
  podSelector:
    matchLabels:
      app: falkordb-browser
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: falkordb
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
