---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falkordb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aadarshadhakalg/homeserver.git
    targetRevision: main
    # resources/, not this folder: a directory source here would also render
    # this file, which app-of-apps owns, and the two would fight over it.
    path: manifests/apps/knowledgeG/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: falkordb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
