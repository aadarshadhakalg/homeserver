---
# Argo CD reconciling its own install, ingress and AppProjects from this repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aadarshadhakalg/homeserver.git
    targetRevision: main
    path: manifests/apps/argocd/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Argo's CRDs exceed the 262144-byte annotation limit of client-side apply.
      - ServerSideApply=true
