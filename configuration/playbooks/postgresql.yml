---
# PostgreSQL on the standalone database node.
# The password must be supplied, e.g.:
#   ansible-playbook playbooks/postgresql.yml -e @secrets.yml --ask-vault-pass
# Usage: ansible-playbook playbooks/postgresql.yml

- name: PostgreSQL server
  hosts: db
  vars:
    postgresql_db: homeserver
    postgresql_user: homeserver
    postgresql_data: /var/lib/pgsql/data
    # Only this subnet may connect remotely; cluster pods egress via their node IP.
    postgresql_allowed_cidr: 10.0.0.0/24
  handlers:
    - name: Restart postgresql
      ansible.builtin.systemd:
        name: postgresql
        state: restarted

  tasks:
    - name: Require a database password
      ansible.builtin.assert:
        that: postgresql_password is defined and postgresql_password | length > 0
        fail_msg: >-
          postgresql_password is not set. Supply it with -e or a vaulted vars
          file; this playbook will not create a passwordless account.

    - name: Install PostgreSQL
      ansible.builtin.dnf:
        name:
          - postgresql-server
          - python3-psycopg2 # required by the community.postgresql modules
        state: present

    - name: Initialise the database cluster
      ansible.builtin.command: postgresql-setup --initdb
      args:
        creates: "{{ postgresql_data }}/PG_VERSION"

    - name: Listen on all interfaces
      ansible.builtin.lineinfile:
        path: "{{ postgresql_data }}/postgresql.conf"
        regexp: '^#?listen_addresses\s*='
        line: "listen_addresses = '*'"
      notify: Restart postgresql

    - name: Write host-based authentication rules
      ansible.builtin.copy:
        dest: "{{ postgresql_data }}/pg_hba.conf"
        owner: postgres
        group: postgres
        mode: "0600"
        content: |
          # Managed by Ansible. Local admin over the unix socket, and the app
          # user only, from the LAN only, with scram-sha-256.
          local   all             all                                     peer
          host    all             all             127.0.0.1/32            scram-sha-256
          host    all             all             ::1/128                 scram-sha-256
          host    {{ postgresql_db }}  {{ postgresql_user }}  {{ postgresql_allowed_cidr }}  scram-sha-256
      notify: Restart postgresql

    - name: Start PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true

    - name: Apply any pending config changes before using the database
      ansible.builtin.meta: flush_handlers

    - name: Create the application database
      community.postgresql.postgresql_db:
        name: "{{ postgresql_db }}"
        state: present
      become: true
      become_user: postgres

    - name: Create the application user
      community.postgresql.postgresql_user:
        login_db: "{{ postgresql_db }}"
        name: "{{ postgresql_user }}"
        password: "{{ postgresql_password }}"
        state: present
      become: true
      become_user: postgres
      no_log: true # keep the password out of the log

    - name: Grant the user access to the database
      community.postgresql.postgresql_privs:
        db: "{{ postgresql_db }}"
        role: "{{ postgresql_user }}"
        type: database
        privs: ALL
        state: present
      become: true
      become_user: postgres
