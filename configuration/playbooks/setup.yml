---
# Base OS prep for every node. Run before rke2.yml.
# Usage: ansible-playbook playbooks/setup.yml

- name: Prepare nodes
  hosts: all
  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Map cluster hosts in /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE homeserver"
        block: |
          {% for h in groups['all'] %}
          {{ hostvars[h].ansible_host }} {{ h }}
          {% endfor %}

    - name: Install base packages
      ansible.builtin.dnf:
        name:
          - curl
          - tar
          - chrony
        state: present

    - name: Enable time sync (etcd is picky about clock skew)
      ansible.builtin.systemd:
        name: chronyd
        state: started
        enabled: true

    - name: Disable firewalld (flat homelab network)
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
        enabled: false
      failed_when: false

    - name: Turn off swap now
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb | default(0) > 0
      changed_when: true

    - name: Turn off swap in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

- name: Kubernetes kernel prep
  hosts: rke2_cluster
  tasks:
    - name: Install kernel modules package
      ansible.builtin.dnf:
        name: kernel-modules-extra # br_netfilter lives here on AlmaLinux 10
        state: present

    - name: Find newest installed kernel
      ansible.builtin.command: rpm -q kernel --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n'
      register: installed_kernels
      changed_when: false

    - name: Reboot into the newest kernel
      # br_netfilter ships only with the newest kernel's modules; running an
      # older kernel leaves the module missing and kube-proxy cannot program
      # service rules, which wedges the CNI.
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: ansible_kernel != (installed_kernels.stdout_lines | sort | last)

    - name: Load kernel modules required by Kubernetes
      community.general.modprobe:
        name: "{{ item }}"
        state: present
        persistent: present
      loop:
        - overlay
        - br_netfilter

    - name: Set Kubernetes sysctls
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/99-kubernetes.conf
        reload: true
      loop:
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables
        - net.ipv4.ip_forward
